{# The two coverage panels, side by side above the table. Both are plain SVG with
   no script: every clickable thing is an <a> carrying the same query string the
   filter form builds, so a view of the chart is a link like any other view. #}
<section class="coverage">
<div class="panels">

  <figure class="panel map">
    <figcaption>
      <h2>Guide coverage</h2>
      {# The captions read the same whatever is selected, so selecting never moves
         the drawing under the pointer. The selection is said in the filter form.
         Only what the drawing cannot say for itself: the strands are labelled on the
         SVG, and the shortening is the one thing a reader would otherwise misread. #}
      <p class="muted">Introns and UTRs shortened to the {{ params.intron_buffer }} bp either side a
      guide can reach. Click an exon to filter the table.</p>
      {# The legend carries each class's count, so the colours and the tally are one
         thing to read rather than the same five labels written out twice. Only the
         classes this result contains are listed; a zero has nothing to point at. #}
      <ul class="key">
        <li class="total">{{ '{:,}'.format(map.total) }} guides</li>
        {% for entry in map.counts %}
        <li><i class="c-{{ entry.cls }}"></i>{{ '{:,}'.format(entry.count) }} {{ entry.label }}</li>
        {% endfor %}
        {# Always laid out, only hidden, so the key cannot wrap onto a new line
           and push the map down when a square is picked. #}
        <li{% if not view.sub %} class="off" aria-hidden="true"{% endif %}><i class="hl"></i>selected change</li>
      </ul>
    </figcaption>
    <svg class="viz gene" viewBox="0 0 {{ map.width }} {{ map.height }}" role="img"
         aria-label="Guides along {{ transcript_id }}, by position and consequence">
      <text x="{{ map.margin }}" y="14">sense &uarr;</text>
      <text x="{{ map.margin }}" y="{{ map.height - 6 }}">antisense &darr;</text>
      <line class="spine" x1="{{ map.margin }}" x2="{{ map.width - map.margin }}"
            y1="{{ map.midline }}" y2="{{ map.midline }}"/>
      {% for bin in map.bins %}
      <g class="bin"><title>{{ bin.title }}</title>
        {% for seg in bin.segments %}<rect class="c-{{ seg.cls }}" x="{{ seg.x }}" y="{{ seg.y }}" width="{{ seg.width }}" height="{{ seg.height }}"/>{% endfor %}
        <rect class="hit" x="{{ bin.x }}" y="18" width="{{ bin.width }}" height="{{ map.height - 40 }}"/>
      </g>
      {% endfor %}
      {# A column rather than a block on the gene: the exon track underneath stays
         readable, and a marked column cannot be mistaken for a selected exon, which
         is drawn in the same ink. #}
      {% for mark in map.highlight %}
      <g class="hl"><rect class="band" x="{{ mark.x }}" y="18" width="{{ mark.width }}" height="{{ map.height - 40 }}"/><rect class="tick" x="{{ mark.x }}" y="18" width="{{ mark.width }}" height="5"/></g>
      {% endfor %}
      {# Exons go above the bins and the highlight: each bin's hover target spans
         the full chart height, so drawn later it would take the exon's click. #}
      {% for exon in map.exons %}
      <a href="{{ exon.url }}"><g class="exon{{ ' on' if exon.selected else '' }}"><title>{{ exon.title }}{{ ' - showing only these' if exon.selected else ' - click to filter' }}</title>
        {% for block in exon.blocks %}<rect x="{{ block.x }}" y="{{ block.y }}" width="{{ block.width }}" height="{{ block.height }}" rx="1"/>{% endfor %}
      </g></a>
      {% endfor %}
      {% for exon in map.exons if exon.label %}
      <text class="exl" x="{{ exon.label_x }}" y="{{ map.midline + 3 }}">{{ exon.label }}</text>
      {% endfor %}
      <text x="{{ map.margin }}" y="{{ map.midline - 18 }}">5&prime;</text>
      <text class="end" x="{{ map.width - map.margin }}" y="{{ map.midline - 18 }}">3&prime;</text>
    </svg>
  </figure>

  <figure class="panel matrix">
    <figcaption>
      <h2>Possible residue changes</h2>
      <p class="muted">Click a square to filter the table and mark those guides on the map.</p>
      {# One encoding, so one legend entry. A grey square is on the diagonal, where
         the two residues are the same, and an empty one is empty. #}
      <ul class="key ramp">
        {% if matrix.shaded %}<li>Guides
          <span>{{ matrix.low }}</span>
          <svg class="bar" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="guide-ramp">{% for stop in matrix.ramp %}<stop offset="{{ stop.offset }}" stop-color="{{ stop.colour }}"/>{% endfor %}</linearGradient></defs>
            <rect width="100" height="10" fill="url(#guide-ramp)"/>
          </svg>
          <span>{{ matrix.high }}</span></li>{% endif %}
      </ul>
    </figcaption>
    <svg class="viz mtx" viewBox="0 0 {{ matrix.width }} {{ matrix.height }}" role="img"
         aria-label="Residue substitutions reachable with this editor">
      {% for cell in matrix.cells %}
      {% if cell.url %}<a href="{{ cell.url }}">{% endif %}<g class="cell {{ cell.cls }}{{ ' on' if cell.selected else '' }}"><title>{{ cell.title }}</title><rect x="{{ cell.x }}" y="{{ cell.y }}" width="{{ matrix.cell }}" height="{{ matrix.cell }}"{% if cell.fill %} fill="{{ cell.fill }}"{% endif %}/></g>{% if cell.url %}</a>{% endif %}
      {% endfor %}
      {% for rule in matrix.rules %}
      <line class="sep" x1="{{ matrix.left + rule * matrix.cell }}" x2="{{ matrix.left + rule * matrix.cell }}" y1="{{ matrix.top }}" y2="{{ matrix.top + matrix.size }}"/>
      <line class="sep" x1="{{ matrix.left }}" x2="{{ matrix.left + matrix.size }}" y1="{{ matrix.top + rule * matrix.cell }}" y2="{{ matrix.top + rule * matrix.cell }}"/>
      {% endfor %}
      <rect class="frame" x="{{ matrix.left }}" y="{{ matrix.top }}" width="{{ matrix.size }}" height="{{ matrix.size }}"/>
      {% for label in matrix.labels %}{% set index = loop.index0 %}
      <text class="rl" x="{{ matrix.left - 6 }}" y="{{ matrix.top + index * matrix.cell + matrix.cell / 2 + 4 }}">{{ label }}</text>
      {# A label longer than a letter is turned on its side to fit its column. #}
      {% if label|length > 1 %}
      <text class="cl rot" transform="translate({{ matrix.left + index * matrix.cell + matrix.cell / 2 + 4 }},{{ matrix.top + matrix.size + 8 }}) rotate(-90)">{{ label }}</text>
      {% else %}
      <text class="cl" x="{{ matrix.left + index * matrix.cell + matrix.cell / 2 }}" y="{{ matrix.top + matrix.size + 16 }}">{{ label }}</text>
      {% endif %}
      {% endfor %}
      {% for group in matrix.groups %}
      <text class="gl" x="{{ matrix.left - 26 }}" y="{{ matrix.top + group.centre * matrix.cell + 4 }}">{{ group.name }}</text>
      <text class="gl mid" x="{{ matrix.left + group.centre * matrix.cell }}" y="{{ matrix.top + matrix.size + 38 }}">{{ group.name }}</text>
      {% endfor %}
      <text class="ax" transform="translate(14,{{ matrix.top + matrix.size / 2 }}) rotate(-90)">Initial residue</text>
      <text class="ax" x="{{ matrix.left + matrix.size / 2 }}" y="{{ matrix.height - 6 }}">Resulting residue</text>
    </svg>
  </figure>

</div>

</section>
