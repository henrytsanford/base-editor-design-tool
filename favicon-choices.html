<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon choices</title>
<style>
:root { --fg: #1a1a1a; --muted: #666; --line: #ddd; --bg: #fff; --card: #fafafa;
        --accent: #0b5; --accent-tint: #f3fbf6; --accent-line: #bfe6cd;
        --lof: #eb6834; --mis: #2a78d6; --sil: #1baf7a; --nc: #b9b9b9;
        --ink: #1a1a1a; --exon-block: #7a7a7a;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --fg: #eaeaea; --muted: #9a9a9a; --line: #333; --bg: #151515; --card: #1d1d1d; }
}
:root[data-theme="dark"] { --fg: #eaeaea; --muted: #9a9a9a; --line: #333; --bg: #151515; --card: #1d1d1d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.lede { color: var(--muted); margin: 0 0 20px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 3px; }
.sw i { width: 16px; height: 16px; border-radius: 50%; display: block; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.card h2 { font-size: 14px; margin: 0; }
.card p { color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
.sizes { display: flex; align-items: flex-end; gap: 10px; }
.tile { display: flex; align-items: center; justify-content: center; border-radius: 6px;
        width: 80px; height: 80px; }
.tile.light { background: #fff; border: 1px solid #e4e4e4; }
.tile.dark { background: #202124; }
.small { display: flex; flex-direction: column; gap: 6px; }
.small span { display: flex; align-items: center; justify-content: center;
              width: 36px; height: 36px; border-radius: 4px; }
.small .light { background: #fff; border: 1px solid #e4e4e4; }
.small .dark { background: #202124; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
button { font: 12px var(--sans); border: 1px solid var(--line); background: var(--bg);
         color: var(--fg); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Favicon choices</h1>
  <p class="lede">Ten SVG favicons drawn from the palette in <code>service/static/app.css</code>, shown at 64, 32 and 16 px on light and dark tab bars. "Try in tab" sets this page's own favicon so you can see it at real size.</p>
  <div class="swatches" id="swatches"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
const C = { accent: '#0b5', tint: '#f3fbf6', tintLine: '#bfe6cd', lof: '#eb6834', mis: '#2a78d6',
            sil: '#1baf7a', nc: '#b9b9b9', ink: '#1a1a1a', exon: '#7a7a7a', spine: '#bbb' };

const svg = body => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${body}</svg>`;

const icons = [
  { name: 'Accent tile', note: 'The accent green with a white "B", like the badge.',
    svg: svg(`<rect width="32" height="32" rx="7" fill="${C.accent}"/><path d="M10 7h7.5a5 5 0 0 1 3.4 8.7A5.3 5.3 0 0 1 18 25H10z M14 11v4h3.3a2 2 0 0 0 0-4z M14 18.5v3h3.8a1.5 1.5 0 0 0 0-3z" fill="#fff" fill-rule="evenodd"/>`) },
  { name: 'Consequence bars', note: 'Loss-of-function, missense and silent as three bars.',
    svg: svg(`<rect x="3" y="14" width="7" height="15" rx="1.5" fill="${C.lof}"/><rect x="12.5" y="5" width="7" height="24" rx="1.5" fill="${C.mis}"/><rect x="22" y="10" width="7" height="19" rx="1.5" fill="${C.sil}"/>`) },
  { name: 'Substitution matrix', note: 'A 2x2 of the matrix hues, with non-coding grey.',
    svg: svg(`<rect x="2" y="2" width="13" height="13" rx="2" fill="${C.lof}"/><rect x="17" y="2" width="13" height="13" rx="2" fill="${C.mis}"/><rect x="2" y="17" width="13" height="13" rx="2" fill="${C.sil}"/><rect x="17" y="17" width="13" height="13" rx="2" fill="${C.nc}"/>`) },
  { name: 'Exon map', note: 'Gene spine with exon blocks; the selected one in accent.',
    svg: svg(`<rect x="1" y="15" width="30" height="2" fill="${C.spine}"/><rect x="2" y="10" width="7" height="12" rx="1.5" fill="${C.exon}"/><rect x="12" y="6" width="8" height="20" rx="1.5" fill="${C.accent}"/><rect x="23" y="10" width="7" height="12" rx="1.5" fill="${C.exon}"/>`) },
  { name: 'Guide arrow', note: 'A guide on a strand, pointing at the edit site.',
    svg: svg(`<rect x="2" y="22" width="28" height="3" rx="1.5" fill="${C.exon}"/><path d="M4 11h16V5l9 8.5-9 8.5v-6H4z" fill="${C.accent}"/>`) },
  { name: 'Helix', note: 'Two strands in mis/lof with grey rungs.',
    svg: svg(`<g stroke-linecap="round" fill="none"><path d="M9 3c0 7 14 7 14 13S9 22 9 29" stroke="${C.mis}" stroke-width="3.2"/><path d="M23 3c0 7-14 7-14 13s14 6 14 13" stroke="${C.lof}" stroke-width="3.2"/><path d="M12 8.2h8M12 23.8h8" stroke="${C.exon}" stroke-width="2"/></g>`) },
  { name: 'Edit dot', note: 'Ink tile with a single green base highlighted.',
    svg: svg(`<rect width="32" height="32" rx="7" fill="${C.ink}"/><g fill="#555"><circle cx="8" cy="16" r="2.6"/><circle cx="24" cy="16" r="2.6"/></g><circle cx="16" cy="16" r="5" fill="${C.accent}"/>`) },
  { name: 'Tint letter', note: 'Pale accent tint, accent border, green "b".',
    svg: svg(`<rect x="1" y="1" width="30" height="30" rx="7" fill="${C.tint}" stroke="${C.tintLine}" stroke-width="2"/><path d="M10 6h4.5v7.2a6.5 6.5 0 1 1-4.5 6.2z M16.5 15.5a3.8 3.8 0 1 0 0 7.6a3.8 3.8 0 0 0 0-7.6z" fill="${C.accent}" fill-rule="evenodd"/>`) },
  { name: 'Coverage histogram', note: 'Gene-map bins in accent at stepped opacity.',
    svg: svg(`<g fill="${C.accent}"><rect x="2" y="18" width="5" height="12" rx="1" opacity=".45"/><rect x="8" y="8" width="5" height="22" rx="1"/><rect x="14" y="13" width="5" height="17" rx="1" opacity=".75"/><rect x="20" y="4" width="5" height="26" rx="1"/><rect x="26" y="20" width="4" height="10" rx="1" opacity=".45"/></g>`) },
  { name: 'Tri-colour ring', note: 'The three consequence hues as a ring around ink.',
    svg: svg(`<g fill="none" stroke-width="6"><path d="M16 4a12 12 0 0 1 10.4 18" stroke="${C.lof}"/><path d="M26.4 22A12 12 0 0 1 5.6 22" stroke="${C.mis}"/><path d="M5.6 22A12 12 0 0 1 16 4" stroke="${C.sil}"/></g><circle cx="16" cy="16" r="4" fill="${C.ink}"/>`) },
];

const uri = s => 'data:image/svg+xml,' + encodeURIComponent(s);
const img = (s, px) => `<img src="${uri(s)}" width="${px}" height="${px}" alt="">`;

document.getElementById('swatches').innerHTML = Object.entries({
  accent: C.accent, 'accent-tint': C.tint, 'accent-line': C.tintLine, lof: C.lof, mis: C.mis,
  sil: C.sil, nc: C.nc, ink: C.ink, 'exon-block': C.exon,
}).map(([k, v]) => `<span class="sw"><i style="background:${v};${v === C.tint ? 'border:1px solid #ccc' : ''}"></i>${k}</span>`).join('');

const grid = document.getElementById('grid');
icons.forEach((ic, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>${i + 1}. ${ic.name}</h2><p>${ic.note}</p>
    <div class="sizes">
      <div class="tile light">${img(ic.svg, 64)}</div>
      <div class="tile dark">${img(ic.svg, 64)}</div>
      <div class="small"><span class="light">${img(ic.svg, 32)}</span><span class="dark">${img(ic.svg, 32)}</span></div>
      <div class="small"><span class="light">${img(ic.svg, 16)}</span><span class="dark">${img(ic.svg, 16)}</span></div>
    </div>
    <div class="actions"><button data-act="try">Try in tab</button><button data-act="copy">Copy SVG</button></div>`;
  card.querySelector('[data-act=try]').onclick = e => {
    let link = document.querySelector('link[rel=icon]');
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.type = 'image/svg+xml';
    link.href = uri(ic.svg);
    document.querySelectorAll('button.on').forEach(b => b.classList.remove('on'));
    e.target.classList.add('on');
  };
  card.querySelector('[data-act=copy]').onclick = async e => {
    try { await navigator.clipboard.writeText(ic.svg); e.target.textContent = 'Copied'; }
    catch { e.target.textContent = 'Copy failed'; }
    setTimeout(() => (e.target.textContent = 'Copy SVG'), 1200);
  };
  grid.appendChild(card);
});
</script>
</body>
</html>
